[package]
name = "kodeman-cli"
version = "0.2.0"
edition = "2024"

[dependencies]
clap = { version = "4.5.39", features = ["derive"] }
chrono = { version = "0.4.41", features = ["serde"] }
serde = { version = "1.0.219", features = ["derive"]}
serde_json = "1.0.140"
serde_repr = "0.1.20"
serde-inline-default = "0.2.3"
once_cell = "1.21.3"
rsa = { version = "0.9.8", features = ["pem", "sha2"] }
rand = "0.8.5"
colored = "3.0.0"
uuid = { version = "1.17.0", features = ["serde", "v4"] }
sha2 = "0.10.9"
base64 = "0.22.1"
reqwest = { version = "0.12.23", features = ["json", "blocking", "multipart"] }
regex = "1.11.2"
rpassword = "7.4.0"
dirs = "6.0.0"
